name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shared-types
        run: npm run typecheck --workspace=@erp/shared-types

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@erp/backend

      - name: Typecheck backend
        run: npm run typecheck --workspace=@erp/backend

      - name: Typecheck frontend
        run: npm run typecheck --workspace=@erp/frontend

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm run test --workspace=@erp/backend --if-present

      - name: Run Frontend Tests
        run: npm run test --workspace=@erp/frontend --if-present

