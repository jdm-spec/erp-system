<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:* ws://localhost:* https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com;" />
    <meta name="description" content="Modular, fully customizable Enterprise ERP Management System built with vanilla JavaScript and Tailwind CSS." />
    <title>Enterprise ERP Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      @keyframes erpPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .animate-pulse {
        animation: erpPulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>
  <body class="h-full bg-[#FAFAFA] text-zinc-900 antialiased dark:bg-[#09090B] dark:text-zinc-100 font-sans selection:bg-zinc-900 selection:text-white dark:selection:bg-white dark:selection:text-zinc-900">
    <div id="app" class="h-full flex flex-col">
      <!-- Minimal Elegant Instant Skeleton Loader on Reload -->
      <div class="flex h-screen overflow-hidden bg-[#FAFAFA] dark:bg-[#09090B]">
        <!-- Sidebar Skeleton (Desktop) -->
        <div class="hidden lg:flex w-64 flex-col border-r border-zinc-200/80 dark:border-zinc-800/80 bg-white dark:bg-[#0B0B0E] p-4 space-y-6 flex-shrink-0">
          <div class="flex items-center gap-2.5 px-2">
            <div class="w-8 h-8 rounded-lg bg-zinc-200 dark:bg-zinc-800 animate-pulse"></div>
            <div class="space-y-1.5 flex-1">
              <div class="h-3.5 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-3/4"></div>
              <div class="h-2.5 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-1/2"></div>
            </div>
          </div>
          <div class="space-y-2 pt-2">
            <div class="h-8 bg-zinc-100 dark:bg-zinc-800/50 rounded-xl animate-pulse"></div>
            <div class="h-8 bg-zinc-100 dark:bg-zinc-800/50 rounded-xl animate-pulse"></div>
            <div class="h-8 bg-zinc-100 dark:bg-zinc-800/50 rounded-xl animate-pulse"></div>
            <div class="h-8 bg-zinc-100 dark:bg-zinc-800/50 rounded-xl animate-pulse"></div>
            <div class="h-8 bg-zinc-100 dark:bg-zinc-800/50 rounded-xl animate-pulse"></div>
            <div class="h-8 bg-zinc-100 dark:bg-zinc-800/50 rounded-xl animate-pulse"></div>
            <div class="h-8 bg-zinc-100 dark:bg-zinc-800/50 rounded-xl animate-pulse"></div>
          </div>
        </div>

        <!-- Main Viewport Skeleton -->
        <div class="flex-1 flex flex-col min-w-0">
          <!-- Topbar Skeleton -->
          <div class="h-16 border-b border-zinc-200/80 dark:border-zinc-800/80 bg-white dark:bg-[#0B0B0E] px-4 sm:px-6 flex items-center justify-between">
            <div class="h-4 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-32"></div>
            <div class="flex items-center gap-3">
              <div class="h-8 w-28 bg-zinc-100 dark:bg-zinc-800 rounded-xl animate-pulse hidden sm:block"></div>
              <div class="w-8 h-8 rounded-full bg-zinc-200 dark:bg-zinc-800 animate-pulse"></div>
            </div>
          </div>

          <!-- Content Skeleton -->
          <div class="flex-1 p-4 sm:p-6 max-w-7xl w-full mx-auto space-y-4 sm:space-y-6 overflow-hidden">
            <div class="h-7 bg-zinc-200 dark:bg-zinc-800 rounded-xl animate-pulse w-44"></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
              <div class="h-28 bg-white dark:bg-[#0D0D11] rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 p-5 space-y-3">
                <div class="h-3 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-1/2"></div>
                <div class="h-7 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-3/4"></div>
              </div>
              <div class="h-28 bg-white dark:bg-[#0D0D11] rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 p-5 space-y-3">
                <div class="h-3 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-1/2"></div>
                <div class="h-7 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-3/4"></div>
              </div>
              <div class="h-28 bg-white dark:bg-[#0D0D11] rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 p-5 space-y-3">
                <div class="h-3 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-1/2"></div>
                <div class="h-7 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-3/4"></div>
              </div>
              <div class="h-28 bg-white dark:bg-[#0D0D11] rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 p-5 space-y-3">
                <div class="h-3 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-1/2"></div>
                <div class="h-7 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-3/4"></div>
              </div>
            </div>
            <div class="h-72 bg-white dark:bg-[#0D0D11] rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 p-6 space-y-3">
              <div class="h-4 bg-zinc-200 dark:bg-zinc-800 rounded animate-pulse w-1/4"></div>
              <div class="h-3 bg-zinc-100 dark:bg-zinc-800/60 rounded animate-pulse w-full"></div>
              <div class="h-3 bg-zinc-100 dark:bg-zinc-800/60 rounded animate-pulse w-full"></div>
              <div class="h-3 bg-zinc-100 dark:bg-zinc-800/60 rounded animate-pulse w-4/5"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="modal-root" class="relative z-50"></div>
    <div id="toast-root" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none" aria-live="polite"></div>
    <div id="command-palette-root" class="relative z-50"></div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
